# Rebuilds the catalogue outputs whenever the code, product data or photos change on main,
# and commits the fresh HTML back to the repo — so output/ is always in step with the code.
name: Rebuild catalogue

on:
  push:
    branches: [main]
    paths: ['src/**', 'photos/**', 'assets/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build outputs
        working-directory: src
        run: |
          python3 build_catalogue2.py
          python3 build_trade.py
          python3 build_shootlist.py
      - name: Commit rebuilt outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "Outputs already up to date" && exit 0
          git commit -m "Rebuild catalogue outputs [skip ci]"
          git push
